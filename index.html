<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Клатч</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="preload" as="image" href="img/ui_menu_key.webp" />
</head>
<body>
  <!-- Заставка: видна сразу, пока грузится и запускается игра; игра заменит её своим экраном -->
  <style>
    html, body { margin: 0; background: #0b0d10; }
    .boot { position: fixed; inset: 0; display: grid; place-content: center; justify-items: center; gap: 14px; background: radial-gradient(ellipse at 50% 35%, #1b222b, #0b0d10 70%); color: #e9edf2; font: 600 13px/1.3 Oswald, 'Arial Narrow', system-ui, sans-serif; letter-spacing: .14em; text-transform: uppercase; }
    .boot b { font-size: 46px; letter-spacing: .08em; color: #fff; }
    .boot b i { font-style: normal; color: #e8a33d; }
    .boot small { opacity: .55; }
    .boot .bar { width: 180px; height: 3px; background: rgba(255,255,255,.12); overflow: hidden; border-radius: 2px; }
    .boot .bar::after { content: ''; display: block; width: 40%; height: 100%; background: #e8a33d; animation: bootbar 1.1s ease-in-out infinite; }
    @keyframes bootbar { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
  </style>
  <div id="app"><div class="boot"><b>КЛАТ<i>Ч</i></b><div class="bar"></div><small>Загрузка…</small></div></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
